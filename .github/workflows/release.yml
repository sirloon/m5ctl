name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: m5ctl-linux-x86_64
          path: target/release/m5ctl

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: m5ctl-linux-x86_64
          path: dist

      - name: Checksum
        run: (cd dist && sha256sum m5ctl > m5ctl-linux-x86_64.sha256)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/m5ctl#m5ctl-linux-x86_64 \
            dist/m5ctl-linux-x86_64.sha256 \
            --title "m5ctl $GITHUB_REF_NAME" \
            --generate-notes
